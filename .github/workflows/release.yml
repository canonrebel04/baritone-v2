name: Release

# This workflow runs when a tag is pushed (e.g., v26.1)
# It dynamically builds loaders specified in gradle.properties and creates a GitHub release with the JARs

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'oracle'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Get version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

    - name: Build mod loaders
      run: ./gradlew build -Pmod_version=${{ steps.version.outputs.VERSION }} --stacktrace --no-daemon

    - name: Create dist files
      run: ./gradlew createDist -Pmod_version=${{ steps.version.outputs.VERSION }} --stacktrace --no-daemon

    - name: Collect release artifacts
      id: collect
      run: |
        mkdir release_artifacts
        # Copy regular jars and api jars, but exclude dev, unoptimized, shadow, and common jars
        find . -name "*.jar" -path "*/build/libs/*" ! -name "*dev*" ! -name "*unoptimized*" ! -name "*shadow*" ! -name "*common*" -exec cp {} release_artifacts/ \;
        cp dist/*.jar release_artifacts/ 2>/dev/null || true
        echo "=== Collected Release Artifacts ==="
        ls -la release_artifacts
        # Count the number of files
        count=$(ls -1 release_artifacts/*.jar 2>/dev/null | wc -l)
        echo "artifacts_count=$count" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Baritone v${{ steps.version.outputs.VERSION }}
        body: |
          ## Baritone v${{ steps.version.outputs.VERSION }} Release

          📦 All built artifacts are attached as release assets.
          
          ### 📝 Changelog
          See [CHANGELOG.md](https://github.com/canonrebel04/baritone-v2/blob/${{ github.ref_name }}/CHANGELOG.md) for details.

          ### ⚡ Features
          - Full pathfinding system for Minecraft
          - Dynamic loader support based on configuration
          - Extensive command system for chat control
          - Elytra flying, mining, building, and more

          ### 🔧 Installation
          1. Download the JAR for your mod loader (e.g. Fabric, Forge, etc.)
          2. Place in the `mods` folder
          3. Launch Minecraft
        draft: false
        prerelease: false
        files: release_artifacts/*.jar
        fail_on_unmatched_files: true
        make_latest: true