name: CI Build

# This workflow runs on every push and pull request
# It builds all active loaders and uploads the final release jars

on:
  push:
    branches: [ "26.1", "main", "master" ]
  pull_request:
    branches: [ "26.1", "main", "master" ]

jobs:
  build:
    name: Build Baritone
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Get version
      id: version
      run: |
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=26.1-SNAPSHOT" >> $GITHUB_OUTPUT
        fi

    - name: Build mod
      run: ./gradlew build -Pmod_version=${{ steps.version.outputs.VERSION }} --stacktrace --no-daemon

    - name: Create dist files
      run: ./gradlew createDist -Pmod_version=${{ steps.version.outputs.VERSION }} --stacktrace --no-daemon

    - name: Collect release artifacts
      run: |
        mkdir release_artifacts
        # Copy regular jars and api jars, but exclude dev, unoptimized, shadow, and common jars
        find . -name "*.jar" -path "*/build/libs/*" ! -name "*dev*" ! -name "*unoptimized*" ! -name "*shadow*" ! -name "*common*" -exec cp {} release_artifacts/ \;
        cp dist/*.jar release_artifacts/ 2>/dev/null || true
        echo "=== Collected Release Artifacts ==="
        ls -la release_artifacts

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: baritone-release-jars
        path: release_artifacts/*.jar
        retention-days: 30
