name: CI Build

# This workflow runs on every push and pull request
# It builds all three mod loaders and runs tests

on:
  push:
    branches: [ "26.1", "main", "master" ]
  pull_request:
    branches: [ "26.1", "main", "master" ]

jobs:
  setup:
    name: Setup and Validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Get version
      id: version
      run: |
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=26.1-SNAPSHOT" >> $GITHUB_OUTPUT
        fi

  build-fabric:
    name: Build Fabric
    needs: setup
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Fabric mod
      run: ./gradlew :fabric:build -Pmod_version=${{ needs.setup.outputs.version }} --stacktrace --no-daemon

    - name: Upload Fabric artifacts
      uses: actions/upload-artifact@v4
      with:
        name: baritone-fabric-${{ needs.setup.outputs.version }}
        path: fabric/build/libs/*.jar
        retention-days: 30

  build-forge:
    name: Build Forge
    needs: setup
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Forge mod
      run: ./gradlew :forge:build -Pmod_version=${{ needs.setup.outputs.version }} --stacktrace --no-daemon

    - name: Upload Forge artifacts
      uses: actions/upload-artifact@v4
      with:
        name: baritone-forge-${{ needs.setup.outputs.version }}
        path: forge/build/libs/*.jar
        retention-days: 30

  build-neoforge:
    name: Build NeoForge
    needs: setup
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build NeoForge mod
      run: ./gradlew :neoforge:build -Pmod_version=${{ needs.setup.outputs.version }} --stacktrace --no-daemon

    - name: Upload NeoForge artifacts
      uses: actions/upload-artifact@v4
      with:
        name: baritone-neoforge-${{ needs.setup.outputs.version }}
        path: neoforge/build/libs/*.jar
        retention-days: 30

  test:
    name: Run Tests
    needs: [build-fabric, build-forge, build-neoforge]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run tests
      run: ./gradlew test -Pmod_version=${{ needs.setup.outputs.version }} --stacktrace --no-daemon --continue

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Test-Results
        path: |
          **/build/reports/
          **/build/test-results/
        retention-days: 14
